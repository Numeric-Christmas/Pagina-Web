<div id="contenedorCorazonCanvas" class="d-flex flex-column align-items-center justify-content-center w-100">
    <canvas id="cvsCorazon" class="canvas-tactico"></canvas>
</div>

<style>
    #contenedorCorazonCanvas {
        width: 100%;
        max-width: 440px;
        margin: 0 auto;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .canvas-tactico {
        width: 100%;
        max-width: 410px;
        height: auto;
        aspect-ratio: 1 / 1.05;
        display: block;
        margin: 0 auto;
        background-color: #0d1117;
        border-radius: 20px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.65);
        cursor: pointer;
    }
</style>

<script>
(() => {
    const canvas = document.getElementById('cvsCorazon');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    const ANCHO = 800;
    const ALTO = 840;
    canvas.width = ANCHO;
    canvas.height = ALTO;

    const NUM_FILAS = 28;
    const NUM_COLUMNAS = 33;
    const TITULO = "Hecho con <3, MÉTODOS NUMÉRICOS";
    const MENSAJE_ANIMADO = "MÉTODOS NUMÉRICOS";

    // Ecuación implícita simétrica: (x^2 + y^2 - 1)^3 - x^2 * y^3 <= 0
    // Elimina la cola vertical y deja una punta cónica perfecta
    function insideHeart(x, y) {
        // Escala normalizada del cardioide
        const x2 = x * x;
        const y2 = y * y;
        const val = Math.pow(x2 + y2 - 1.0, 3) - (x2 * Math.pow(y, 3));
        return val <= 0;
    }

    // Límites simétricos del cardioide
    const X_MIN = -1.25, X_MAX = 1.25;
    const Y_MIN = -1.15, Y_MAX = 1.35;

    function mapX(x) {
        return 50 + ((x - X_MIN) / (X_MAX - X_MIN)) * (ANCHO - 100);
    }

    function mapY(y) {
        const topMargen = 160;   
        const bottomMargen = 60; 
        const altoEfectivo = ALTO - topMargen - bottomMargen;
        return (ALTO - bottomMargen) - (((y - Y_MIN) / (Y_MAX - Y_MIN)) * altoEfectivo);
    }

    const xVals = [];
    for (let c = 0; c < NUM_COLUMNAS; c++) {
        xVals.push(X_MIN + (c * ((X_MAX - X_MIN) / (NUM_COLUMNAS - 1))));
    }

    const yVals = [];
    for (let r = 0; r < NUM_FILAS; r++) {
        yVals.push(Y_MAX - (r * ((Y_MAX - Y_MIN) / (NUM_FILAS - 1))));
    }

    const puntosCorazon = [];
    yVals.forEach(y => {
        xVals.forEach(x => {
            if (insideHeart(x, y)) {
                puntosCorazon.push({ px: mapX(x), py: mapY(y) });
            }
        });
    });

    let frameActual = 0;
    const totalFrames = NUM_FILAS;
    let animando = false;
    let modoLoop = false;
    let clickTimeout = null;

    function dibujarFrame() {
        ctx.fillStyle = '#0d1117';
        ctx.fillRect(0, 0, ANCHO, ALTO);

        // Título superior
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 30px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText(TITULO, ANCHO / 2, 42);

        // Corazones con tamaño uniforme
        ctx.font = '32px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for (let pt of puntosCorazon) {
            ctx.fillText('❤️', pt.px, pt.py);
        }

        // Mensaje animado descendente
        if (animando || frameActual > 0) {
            const yCartesiano = yVals[Math.min(frameActual, NUM_FILAS - 1)];
            const yPx = mapY(yCartesiano);

            const anchoCaja = 460;
            const altoCaja = 56;
            ctx.fillStyle = 'rgba(13, 17, 23, 0.92)';
            ctx.fillRect((ANCHO - anchoCaja) / 2, yPx - (altoCaja / 2), anchoCaja, altoCaja);

            ctx.fillStyle = '#00ffff';
            ctx.font = 'bold 34px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(MENSAJE_ANIMADO, ANCHO / 2, yPx);
        }
    }

    function cicloAnimacion() {
        if (!animando) return;

        frameActual++;
        if (frameActual >= totalFrames) {
            if (modoLoop) {
                frameActual = 0;
            } else {
                frameActual = 0;
                animando = false;
                dibujarFrame();
                return;
            }
        }

        dibujarFrame();
        setTimeout(cicloAnimacion, 110);
    }

    dibujarFrame();

    // 1 Clic: Mover / Pausar
    canvas.addEventListener('click', () => {
        if (clickTimeout) clearTimeout(clickTimeout);

        clickTimeout = setTimeout(() => {
            modoLoop = false;
            if (animando) {
                animando = false;
            } else {
                animando = true;
                cicloAnimacion();
            }
        }, 220);
    });

    // Doble Clic: Loop continuo
    canvas.addEventListener('dblclick', () => {
        if (clickTimeout) {
            clearTimeout(clickTimeout);
            clickTimeout = null;
        }

        modoLoop = true;
        if (!animando) {
            animando = true;
            cicloAnimacion();
        }
    });
})();
</script>
